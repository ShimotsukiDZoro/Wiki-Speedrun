<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wikipedia Speedrun</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>Wikipedia Speedrun</h1>
      <p class="intro">Race between articles on the real Wikipedia website.</p>

      <section id="challenge-status" aria-live="polite" hidden>
        <p id="status-text"></p>
        <button id="end-button" class="secondary" type="button">End challenge</button>
      </section>

      <form id="challenge-form">
        <div class="article-field">
          <label for="start-title">Starting article</label>
          <div class="input-row">
            <input id="start-title" name="startTitle" placeholder="Earth" required>
            <button class="secondary random-button" type="button" data-target="start-title" aria-label="Pick a popular starting article" title="Pick a popular article from yesterday's page views">Random</button>
          </div>
        </div>

        <div class="article-field">
          <label for="goal-title">Goal article</label>
          <div class="input-row">
            <input id="goal-title" name="goalTitle" placeholder="Solar System" required>
            <button class="secondary random-button" type="button" data-target="goal-title" aria-label="Pick a popular goal article" title="Pick a popular article from yesterday's page views">Random</button>
          </div>
        </div>

        <button id="start-button" type="submit">Start challenge</button>
      </form>

      <p id="error-message" class="error" role="alert" hidden></p>
      <p class="hint">Random picks come from yesterday's most-viewed English Wikipedia articles. Browse Wikipedia and Google in this tab; each page load after the start counts as one step.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
