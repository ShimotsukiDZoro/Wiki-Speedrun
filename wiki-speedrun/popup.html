<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wikipedia Speedrun</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>Wikipedia Speedrun</h1>
      <p class="intro">Race between articles on the real Wikipedia website.</p>

      <section id="challenge-status" aria-live="polite" hidden>
        <p id="status-text"></p>
        <button id="end-button" class="secondary" type="button">End challenge</button>
      </section>

      <form id="challenge-form">
        <label for="start-title">Starting article</label>
        <input id="start-title" name="startTitle" placeholder="Earth" required>

        <label for="goal-title">Goal article</label>
        <input id="goal-title" name="goalTitle" placeholder="Solar System" required>

        <button id="start-button" type="submit">Start challenge</button>
      </form>

      <p id="error-message" class="error" role="alert" hidden></p>
      <p class="hint">Browse Wikipedia and Google in this tab. Each page load on those sites after the start counts as one step.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
